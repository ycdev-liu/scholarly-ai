
services:
  agent-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      SQLITE_DB_PATH: /app/data/checkpoints.db
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      agent-service:
        condition: service_healthy
    restart: unless-stopped

  # 旧版 Streamlit 界面可按需启动：docker compose --profile legacy up streamlit
  streamlit:
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    env_file:
      - .env
    environment:
      AGENT_URL: http://agent-service:8080
    ports:
      - "8501:8501"
    depends_on:
      agent-service:
        condition: service_healthy

  # -----------------------
  # PostgreSQL (长期记忆)
  # -----------------------
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-agent_store}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-admin123}
      - MONGO_INITDB_DATABASE=${MONGO_DB:-agent_checkpoints}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: mongod --auth


  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__HTTP_PORT=6333
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

 

# -----------------------
# 持久化卷
# -----------------------
volumes:
  postgres_data:
  mongo_data:
  qdrant_data:

  # neo4j_data:
  # neo4j_logs:
